name: Commit Checks (pre-commit)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-checks:
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-test.yml@1ce012b023b91e4c293846af4cfd93062d36d1be
    with:
      python-version: "3.13"
      uv-extras: "dev"
      test-dir: "tests/unit_tests"
