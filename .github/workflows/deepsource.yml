name: DeepSource

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".deepsource.toml"
      - ".github/workflows/deepsource.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".deepsource.toml"
      - ".github/workflows/deepsource.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepsource:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev

      - name: Generate coverage report

        run: |
          set -euo pipefail
          uv run --frozen python -m pytest \
            tests/unit_tests tests/integration_tests \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term
          test -s coverage.xml

      - name: Upload coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        uses: deepsourcelabs/test-coverage-action@4284bb73a04adb39faaa6bfcc2d0e3dd137ffed7
        with:
          key: python
          coverage-file: coverage.xml
          dsn: ${{ env.DEEPSOURCE_DSN }}

      - name: DeepSource DSN not configured
        if: ${{ env.DEEPSOURCE_DSN == '' }}
        run: echo "DEEPSOURCE_DSN is not set. Add it as a repository secret."
