name: DeepSource

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".deepsource.toml"
      - ".github/workflows/deepsource.yml"
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".deepsource.toml"
      - ".github/workflows/deepsource.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepsource:
    runs-on: ubuntu-latest
    env:
      DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install dependencies (frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev

      - name: Generate coverage report

        run: |
          set -euo pipefail
          uv run --frozen python -m pytest \
            tests/unit_tests tests/integration_tests \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term
          test -s coverage.xml

      - name: Upload coverage to DeepSource
        if: ${{ env.DEEPSOURCE_DSN != '' }}
        uses: deepsourcelabs/test-coverage-action@4284bb73a04adb39faaa6bfcc2d0e3dd137ffed7
        with:
          key: python
          coverage-file: coverage.xml
          dsn: ${{ env.DEEPSOURCE_DSN }}

      - name: DeepSource DSN not configured
        if: ${{ env.DEEPSOURCE_DSN == '' }}
        run: echo "DEEPSOURCE_DSN is not set. Add it as a repository secret."
