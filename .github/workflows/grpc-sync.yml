name: gRPC Sync

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grpc-sync-and-parity:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-run-commands.yml@main
    with:
      setup-python: true
      python-version: "3.13"
      setup-uv: true
      timeout-minutes: 30
      commands: |-
        set -euo pipefail
        uv sync --frozen --extra dev --extra grpc
        ./scripts/check_grpc_stubs.sh
        uv run --frozen pytest -q tests/integration_tests/test_grpc_parity.py
