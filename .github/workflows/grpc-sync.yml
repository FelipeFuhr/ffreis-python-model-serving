name: gRPC Sync

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  grpc-sync-and-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install dependencies (uv)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra grpc

      - name: Check generated gRPC stubs are current
        run: |
          set -euo pipefail
          ./scripts/check_grpc_stubs.sh

      - name: Run gRPC/API parity test
        run: |
          set -euo pipefail
          uv run --frozen pytest -q tests/integration_tests/test_grpc_parity.py
