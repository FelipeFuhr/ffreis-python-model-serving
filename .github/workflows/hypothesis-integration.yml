name: Hypothesis Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "tests/integration_tests/test_grpc_parity.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/hypothesis-integration.yml"
  schedule:
    - cron: "30 10 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grpc-property-parity-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install deps (dev + grpc, frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra grpc

      - name: Generate and verify gRPC stubs
        run: |
          set -euo pipefail
          ./scripts/generate_grpc_stubs.sh
          ./scripts/check_grpc_stubs.sh

      - name: Run gRPC property parity tests
        env:
          HYPOTHESIS_MAX_EXAMPLES: "40"
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q tests/integration_tests/test_grpc_parity.py -m property

      - name: Upload Hypothesis examples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypothesis-examples-pr-${{ github.run_id }}
          if-no-files-found: ignore
          path: .hypothesis/examples/

  grpc-property-parity-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          enable-cache: true

      - name: Install deps (dev + grpc, frozen)
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra grpc

      - name: Generate and verify gRPC stubs
        run: |
          set -euo pipefail
          ./scripts/generate_grpc_stubs.sh
          ./scripts/check_grpc_stubs.sh

      - name: Run gRPC property parity tests
        env:
          HYPOTHESIS_MAX_EXAMPLES: "180"
        run: |
          set -euo pipefail
          uv run --frozen python -m pytest -q tests/integration_tests/test_grpc_parity.py -m property

      - name: Upload Hypothesis examples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypothesis-examples-nightly-${{ github.run_id }}
          if-no-files-found: ignore
          path: .hypothesis/examples/
