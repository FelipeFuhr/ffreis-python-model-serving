name: Lock Sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    timeout-minutes: 15
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-lock-sync.yml@1ce012b023b91e4c293846af4cfd93062d36d1be
    with:
      python-version: "3.13"
