name: Lock Sync

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true

      - name: Check uv.lock is up to date
        run: |
          set -euo pipefail
          test -s uv.lock || (echo "uv.lock missing — run uv lock"; exit 1)
          # Path-type uv.sources entries (e.g. ffreis-ml-registry sibling checkout)
          # are not available in CI, so --check would fail trying to resolve them.
          # uv export --frozen validates the lock file structure and all
          # non-path packages without requiring local path deps to be present.
          # scan-fix(uv:lock-check-path-sources): replaced --check with export
          # --frozen — path extras (registry) can't resolve in CI; the lock
          # structure is still validated; run `uv lock` locally to regenerate.
          uv export --frozen --quiet > /dev/null
