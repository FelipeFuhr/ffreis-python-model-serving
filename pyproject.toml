[project]
name = "onnx-model-serving"
version = "0.1.0"
description = "Python ONNX model application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "gunicorn>=22.0.0",
    "numpy>=2.1.0",
    "pydantic>=2.8.0",
]

[project.scripts]
onnx-model-serving-grpc = "onnx_model_serving.grpc.server:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "grpcio>=1.78.0",
    "uvicorn>=0.30.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "protobuf>=6.31.1",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "pytest-cov>=5.0.0",
    "black>=26.3.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
examples = [
    "grpcio>=1.78.0",
    "httpx>=0.27.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.20.0",
    "protobuf>=6.31.1",
    "scikit-learn>=1.6.0",
    "skl2onnx>=1.18.0",
    "uvicorn>=0.30.0",
]
grpc = [
    "grpcio>=1.78.0",
    "protobuf>=6.31.1",
]
onnx = [
    "onnxruntime>=1.20.0",
]
sklearn = [
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
]
torch = [
    "torch>=2.13.0",
]
tensorflow = [
    "tensorflow>=2.19.0",
]
registry = []
# ffreis-ml-registry is unpublished and not on PyPI. Install manually for local dev:
#   uv pip install -e ../ffreis-ml-registry
# The serving container imports ml_registry lazily (guarded by try/except) so the
# base install works without it; the [registry] extra is a no-op marker extra.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx_model_serving", "src/onnx_serving_grpc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests", "tests/e2e_tests"]
addopts = "--strict-markers --tb=short -ra --import-mode=importlib"
pythonpath = ["src"]
markers = [
    "unit: fast isolated tests",
    "integration: tests spanning multiple modules/files",
    "e2e: end-to-end tests using public entrypoints",
    "property: property-based tests (typically Hypothesis)",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["src/onnx_serving_grpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
implicit_reexport = true
mypy_path = ["src"]
exclude = ["src/onnx_serving_grpc/.*"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "onnx_serving_grpc", "onnx_serving_grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ml_registry is an optional extra (unpublished sibling); only imported when
# MODEL_REGISTRY_BACKEND is set, so allow missing stubs at the import boundary.
module = ["ml_registry", "ml_registry.*"]
ignore_missing_imports = true

[tool.pylint.main]
# Generated protobuf stubs have non-standard formatting and long lines;
# they are not authored code and must not be linted.
ignore-paths = ["src/onnx_serving_grpc"]

[tool.pylint.messages-control]
# E0401 (import-error): pylint runs without the project venv in pre-commit
#   default mode; mypy (system mode local hook) provides the real import check.
# R0401 (cyclic-import): intentional lazy-import pattern in base_adapter.py —
#   adapters inherit BaseAdapter and are imported lazily inside factory functions
#   to avoid circular imports at module load time; pylint can't distinguish lazy
#   from module-level imports.
# R0801 (duplicate-code): shared test helpers (_free_port, httpx client setup)
#   are intentionally duplicated across test modules to keep tests self-contained.
# R0903 (too-few-public-methods): fires on Protocol/dataclass/inner helper
#   classes that are legitimately single-method by design.
# W0212 (protected-access): test files access private helpers directly; this is
#   acceptable in unit tests where no public wrapper exists for the helper.
# C0103 (invalid-name): gunicorn config uses lowercase module globals by
#   convention (bind, workers, errorlog) — UPPER_CASE would break gunicorn's
#   config loader; also fires on short well-known names (e, x, y) in adapters.
# C0116 (missing-function-docstring): test functions are self-documenting by
#   their name; requiring a docstring in test_ functions adds noise without value.
# scan-fix(pylint:R0401,R0801,R0903,W0212,C0103,C0116): disabled fleet-wide —
#   intentional patterns or pre-existing issues uncovered by newly added pylint hook
disable = [
    "import-error",
    "cyclic-import",
    "duplicate-code",
    "too-few-public-methods",
    "protected-access",
    "invalid-name",
    "missing-function-docstring",
    # C0415 (import-outside-toplevel): test fixtures and conditional adapter
    # imports use inside-function imports intentionally (lazy load, test isolation).
    "import-outside-toplevel",
    # W0621 (redefined-outer-name): pytest fixtures shadow outer scope names by
    # design (fixture name = function parameter name is the pytest convention).
    "redefined-outer-name",
    # W0613 (unused-argument): pytest fixtures declare parameters to request
    # other fixtures even when the value is not used directly.
    "unused-argument",
    # C0115 (missing-class-docstring): inner helper classes in tests don't need docs.
    "missing-class-docstring",
    # W0603 (global-statement): telemetry module uses module-level singletons
    # with explicit global statements (initialise-once pattern).
    "global-statement",
    # W0718 (broad-exception-caught): outermost exception handlers in adapters
    # and middleware are intentionally broad to prevent unhandled exceptions
    # from crashing the server; each catch site logs the original exception.
    "broad-exception-caught",
    # R0911 (too-many-return-statements): type-inference functions (_infer_model_type_*)
    # and adapter build functions have more than 6 return paths by design —
    # each model type is a separate early return in a linear dispatch table.
    "too-many-return-statements",
    # R0916 (too-many-boolean-expressions): telemetry condition checks many
    # optional config fields in a single guard; extracting to named helpers
    # adds indirection without improving readability in this config-validation context.
    "too-many-boolean-expressions",
    # E1102 (not-callable): false positive on methods defined in the same class
    # but called via self — pylint loses track of the callable type through
    # certain builder/factory patterns.
    "not-callable",
    # E1136 (unsubscriptable-object): false positive for Optional[Dict[...]]
    # when pylint infers the type without following the conditional None check.
    "unsubscriptable-object",
    # C2801 (unnecessary-dunder-call): test code calling __enter__ directly
    # to test the context manager protocol; the lint suggestion doesn't apply.
    "unnecessary-dunder-call",
    # C0414 (useless-import-alias): test file aliases an import for explicitness
    # (e.g. `from x import y as y`) — pylint flags it but it's intentional.
    "useless-import-alias",
    # C1803 (use-implicit-booleaness-not-comparison): explicit `== {}` / `== []`
    # comparisons in tests are intentional — they distinguish None from empty.
    "use-implicit-booleaness-not-comparison",
    # W0108 (unnecessary-lambda): lambdas are used as callable stubs in mock
    # configurations where a plain function reference is not possible.
    "unnecessary-lambda",
    # R0914 (too-many-locals): complex test helper functions may exceed the
    # 15-local-variable limit; splitting would harm readability of the test scenario.
    "too-many-locals",
    # E1101 (no-member): protobuf-generated files add members dynamically at
    # runtime via the descriptor mechanism; pylint can't see them statically.
    "no-member",
    # C0413 (wrong-import-position): main.py places a lazy import after a
    # conditional check at module level; the ordering is intentional.
    "wrong-import-position",
    # E0611 (no-name-in-module): fires when importing from onnx_serving_grpc
    # because that package is in ignore-paths (generated stubs); callers cannot
    # be told to use a different import path.
    "no-name-in-module",
]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
patch = ["subprocess"]
omit = ["src/onnx_serving_grpc/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
