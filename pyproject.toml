[project]
name = "onnx-model-serving"
version = "0.1.0"
description = "Python ONNX model application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "gunicorn>=22.0.0",
    "numpy>=2.1.0",
    "pydantic>=2.8.0",
]

[project.scripts]
onnx-model-serving-grpc = "onnx_model_serving.grpc.server:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "grpcio>=1.78.0",
    "uvicorn>=0.30.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "protobuf>=6.31.1",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "pytest-cov>=5.0.0",
    "black>=26.3.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]
examples = [
    "grpcio>=1.78.0",
    "httpx>=0.27.0",
    "onnx>=1.21.0",
    "onnxruntime>=1.20.0",
    "protobuf>=6.31.1",
    "scikit-learn>=1.6.0",
    "skl2onnx>=1.18.0",
    "uvicorn>=0.30.0",
]
grpc = [
    "grpcio>=1.78.0",
    "protobuf>=6.31.1",
]
onnx = [
    "onnxruntime>=1.20.0",
]
sklearn = [
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
]
torch = [
    "torch>=2.12.0",
]
tensorflow = [
    "tensorflow>=2.19.0",
]
registry = [
    "ml_registry>=0.1.0",
]

[tool.uv.sources]
# ffreis-ml-registry is unpublished; resolve the optional extra from the sibling
# checkout. The default install does not require this group, so the serving
# container can be built without the sibling repo present.
# NOTE: path is relative to the canonical checkout location. When working from a
# git worktree at a different path, uv resolves this against the project root
# in the workspace (where pyproject.toml lives), not the worktree CWD.
ml_registry = { path = "/media/ffreis/second/projects/ml/ffreis-ml-registry", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx_model_serving", "src/onnx_serving_grpc"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/integration_tests", "tests/e2e_tests"]
addopts = "--strict-markers --tb=short -ra --import-mode=importlib"
pythonpath = ["src"]
markers = [
    "unit: fast isolated tests",
    "integration: tests spanning multiple modules/files",
    "e2e: end-to-end tests using public entrypoints",
    "property: property-based tests (typically Hypothesis)",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["src/onnx_serving_grpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
implicit_reexport = true
mypy_path = ["src"]
exclude = ["src/onnx_serving_grpc/.*"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "onnx_serving_grpc", "onnx_serving_grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ml_registry is an optional extra (unpublished sibling); only imported when
# MODEL_REGISTRY_BACKEND is set, so allow missing stubs at the import boundary.
module = ["ml_registry", "ml_registry.*"]
ignore_missing_imports = true

[tool.pylint.messages-control]
# E0401 (import-error) fires when pylint runs outside the project venv, which
# is the pre-commit default. All project dependencies are installed in the venv;
# suppress this check globally rather than list every dep individually.
disable = ["import-error"]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
patch = ["subprocess"]
omit = ["src/onnx_serving_grpc/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
